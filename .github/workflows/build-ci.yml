name: NixOS CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - flake.nix
      - flake.lock
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build NixOS configurations
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          nix run nixpkgs#nix-fast-build --accept-flake-config --fallback -- --skip-cached
